{% extends "base.html" %}

{% block title %}Registrar Avaliação{% endblock %}

{% block content %}
<section class="card">
    <h1>Registrar Avaliação</h1>
    <p class="context-line">Jurado: <strong>{{ g.usuario.nome }}</strong></p>

    {% if projetos %}
        <form method="post">
            <div class="field">
                <label for="projeto_id">Projeto</label>
                <select id="projeto_id" name="projeto_id" required>
                    {% for projeto in projetos %}
                        <option value="{{ projeto.id }}">
                            {{ projeto.equipe.hackathon.nome }} — {{ projeto.titulo }} —
                            Equipe {{ projeto.equipe.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="nota">Nota</label>
                <input id="nota" name="nota" type="number" min="0" max="10" step="0.1" required>
            </div>

            <div class="field">
                <label for="comentario">Comentário</label>
                <textarea id="comentario" name="comentario" rows="5" required></textarea>
            </div>

            <button type="submit">Registrar avaliação</button>
        </form>
    {% else %}
        <p class="empty-state">
            Não há projetos nos hackathons aos quais você está associado.
        </p>
    {% endif %}
</section>
{% endblock %}
