{% extends "base.html" %}

{% block title %}Registrar Mentoria{% endblock %}

{% block content %}
<section class="card">
    <h1>Registrar Mentoria</h1>
    <p class="context-line">Mentor: <strong>{{ g.usuario.nome }}</strong></p>

    {% if equipes %}
        <form method="post">
            <div class="field">
                <label for="equipe_id">Equipe</label>
                <select id="equipe_id" name="equipe_id" required>
                    {% for equipe in equipes %}
                        <option value="{{ equipe['id'] }}">
                            {{ equipe['hackathon_nome'] }} — {{ equipe['nome'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="comentario">Comentário</label>
                <textarea id="comentario" name="comentario" rows="5" required></textarea>
            </div>

            <button type="submit">Registrar mentoria</button>
        </form>
    {% else %}
        <p class="empty-state">
            Não há equipes nos hackathons aos quais você está associado.
        </p>
    {% endif %}
</section>
{% endblock %}
