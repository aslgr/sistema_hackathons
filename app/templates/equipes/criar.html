{% extends "base.html" %}

{% block title %}Criar Equipe{% endblock %}

{% block content %}
<section class="card">
    <h1>Criar Equipe</h1>
    <p class="muted">Você será automaticamente o líder e o primeiro integrante da equipe.</p>

    {% if hackathons %}
        <form method="post">
            <div class="field">
                <label for="hackathon_id">Hackathon</label>
                <select id="hackathon_id" name="hackathon_id" required>
                    {% for hackathon in hackathons %}
                        <option value="{{ hackathon.id }}">{{ hackathon.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="nome">Nome da equipe</label>
                <input id="nome" name="nome" type="text" required>
            </div>

            <button type="submit">Criar equipe</button>
        </form>
    {% else %}
        <p class="empty-state">Nenhum hackathon cadastrado.</p>
    {% endif %}
</section>
{% endblock %}
