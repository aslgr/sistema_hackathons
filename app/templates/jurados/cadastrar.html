{% extends "base.html" %}

{% block title %}
Cadastrar Jurado
{% endblock %}

{% block content %}

<h2>Cadastrar Jurado</h2>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}
{% endwith %}

<form method="post">

    <div>
        <label for="nome">Nome</label>
        <input
            type="text"
            id="nome"
            name="nome"
            required
        >
    </div>

    <div>
        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <button type="submit">
        Cadastrar
    </button>

</form>

{% endblock %}
