{% extends "base.html" %}

{% block title %}Registrar Projeto{% endblock %}

{% block content %}
<section class="card">
    <h1>Registrar Projeto</h1>

    {% if equipes %}
        <form method="post">
            <div class="field">
                <label for="equipe_id">Equipe que você lidera</label>
                <select id="equipe_id" name="equipe_id" required>
                    {% for equipe in equipes %}
                        <option value="{{ equipe['id'] }}">
                            {{ equipe['hackathon_nome'] }} — {{ equipe['nome'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="titulo">Título</label>
                <input id="titulo" name="titulo" type="text" required>
            </div>

            <div class="field">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="5" required></textarea>
            </div>

            <div class="field">
                <label for="area_tematica">Área temática</label>
                <input id="area_tematica" name="area_tematica" type="text" required>
            </div>

            <button type="submit">Registrar projeto</button>
        </form>
    {% else %}
        <p class="empty-state">Você precisa ser líder de uma equipe para registrar um projeto.</p>
    {% endif %}
</section>
{% endblock %}
