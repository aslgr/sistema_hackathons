{% extends "base.html" %}

{% block title %}Cadastrar Hackathon{% endblock %}

{% block content %}
<section class="card">
    <h1>Cadastrar Hackathon</h1>

    <form method="post">
        <div class="field">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required>
        </div>

        <div class="form-row">
            <div class="field">
                <label for="data_inicio">Data de início</label>
                <input id="data_inicio" name="data_inicio" type="date" required>
            </div>
            <div class="field">
                <label for="data_fim">Data de fim</label>
                <input id="data_fim" name="data_fim" type="date" required>
            </div>
        </div>

        <div class="field">
            <label for="max_equipes">Máximo de equipes</label>
            <input id="max_equipes" name="max_equipes" type="number" min="1" required>
        </div>

        <button type="submit">Cadastrar hackathon</button>
    </form>
</section>
{% endblock %}
